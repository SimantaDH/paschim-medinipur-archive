<?xml version="1.0" encoding="UTF-8"?>
<!--
  Chitragāthā — original folk-art frieze, drawn for this project.
  A procession band in the spirit of a Patachitra scroll's register: a
  drummer, a dancer, a devotee with a pot, a fish, a tree, a bird. Entirely
  original line work, not traced or copied from any existing scroll, artist
  or publication. Designed to tile horizontally at 600x120 so it can drift
  sideways like a pat being unrolled panel by panel.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" fill="none">
  <g stroke="#A6762E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- ground line -->
    <path d="M0 104h600" stroke-width="1.2" opacity=".55"/>

    <!-- 1. drummer with a dhak -->
    <circle cx="44" cy="34" r="8"/>
    <path d="M44 42v26"/>
    <path d="M44 48l-12 8M44 48l12 8"/>
    <path d="M44 68l-9 22M44 68l9 22"/>
    <path d="M24 54h22l-3 16H27z"/>
    <path d="M24 54l22 0M27 70l16 0"/>
    <path d="M56 56l8-6M32 56l-8-6" stroke-width="1.6"/>

    <!-- 2. dancer, arms raised -->
    <circle cx="140" cy="32" r="8"/>
    <path d="M140 40v24"/>
    <path d="M140 46l-14-8M140 46l14-8"/>
    <path d="M140 64l-12 26M140 64l12 26"/>
    <path d="M126 38l-4-6M154 38l4-6" stroke-width="1.6"/>

    <!-- 3. tree -->
    <path d="M232 104V64"/>
    <path d="M232 64c-14 0-22-9-22-17 8 0 16 5 22 13 6-8 14-13 22-13 0 8-8 17-22 17z"/>
    <path d="M232 76l-10-6M232 84l10-6" stroke-width="1.4"/>

    <!-- 4. devotee carrying a pot -->
    <circle cx="316" cy="38" r="8"/>
    <path d="M316 46v24"/>
    <path d="M316 52l-12 4M316 52l12 4"/>
    <path d="M316 70l-9 20M316 70l9 20"/>
    <path d="M306 22h20l-3 10h-14z"/>
    <ellipse cx="316" cy="22" rx="10" ry="3"/>

    <!-- 5. fish -->
    <path d="M396 76c12-13 30-13 42 0-12 13-30 13-42 0z"/>
    <path d="M438 76l12-8v16l-12-8"/>
    <circle cx="409" cy="73" r="2" fill="#A6762E" stroke="none"/>
    <path d="M416 67c3 6 3 12 0 18M424 68c3 5 3 11 0 16" stroke-width="1.4"/>

    <!-- 6. bird on a branch -->
    <path d="M498 104V72"/>
    <path d="M498 80c8-4 16-3 22 2" stroke-width="1.4"/>
    <path d="M520 82c7-9 18-11 27-5"/>
    <path d="M547 77c6-2 11 1 13 6-5 3-10 3-13-1z"/>
    <path d="M520 82c-2 7 1 13 7 16 7 2 14-1 17-8"/>
    <circle cx="551" cy="78" r="1.6" fill="#A6762E" stroke="none"/>

    <!-- alpana dots threading the register together -->
    <g fill="#A6762E" stroke="none" opacity=".7">
      <circle cx="92" cy="98" r="1.6"/>
      <circle cx="188" cy="98" r="1.6"/>
      <circle cx="276" cy="98" r="1.6"/>
      <circle cx="360" cy="98" r="1.6"/>
      <circle cx="468" cy="98" r="1.6"/>
      <circle cx="580" cy="98" r="1.6"/>
    </g>
  </g>
</svg>
