<?xml version="1.0" encoding="UTF-8"?>
<!--
  Chitragāthā — original folk-motif tile, drawn for this project.
  Not a reproduction of any existing Patachitra scroll or any artist's work:
  these are generic motifs of the kind the tradition draws on (fish, lotus,
  bird, sun-face, vine) rendered as plain line art so they can sit behind
  text at very low opacity without competing with it. Tileable at 220x220.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" fill="none">
  <g stroke="#A6762E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- fish, upper left -->
    <path d="M22 44c10-11 26-11 36 0-10 11-26 11-36 0z"/>
    <path d="M58 44l10-7v14l-10-7z"/>
    <circle cx="33" cy="42" r="1.6" fill="#A6762E" stroke="none"/>
    <path d="M40 36c3 5 3 11 0 16"/>
    <path d="M46 37c2 4 2 10 0 14"/>

    <!-- lotus, upper right -->
    <path d="M160 52c-11 0-16-8-16-14 6 0 12 4 16 11 4-7 10-11 16-11 0 6-5 14-16 14z"/>
    <path d="M160 52c-6 1-10 6-10 11h20c0-5-4-10-10-11z"/>
    <path d="M160 41v11"/>

    <!-- sun-face, centre -->
    <circle cx="110" cy="110" r="15"/>
    <path d="M104 107a2 2 0 0 1 4 0M112 107a2 2 0 0 1 4 0"/>
    <path d="M104 116c3 3 9 3 12 0"/>
    <path d="M110 88v7M110 125v7M88 110h7M125 110h7M95 95l5 5M120 120l5 5M125 95l-5 5M100 120l-5 5"/>

    <!-- bird, lower left -->
    <path d="M30 160c6-8 16-10 24-5"/>
    <path d="M54 155c6-2 10 1 12 5-5 3-9 3-12 0z"/>
    <path d="M30 160c-2 6 0 12 6 15 6 2 13-1 16-7"/>
    <path d="M52 168l6 10M46 170l2 11"/>
    <circle cx="58" cy="156" r="1.4" fill="#A6762E" stroke="none"/>

    <!-- vine with leaves, lower right -->
    <path d="M148 196c14-6 22-18 24-34"/>
    <path d="M155 186c-5-4-5-9-1-12 4 2 5 8 1 12z"/>
    <path d="M165 174c5-3 10-1 11 3-4 3-9 2-11-3z"/>
    <path d="M170 160c-5-3-6-9-2-12 4 2 6 8 2 12z"/>

    <!-- small pot, mid-left edge -->
    <path d="M14 112h16l-2 17a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3z"/>
    <ellipse cx="22" cy="112" rx="8" ry="2.6"/>

    <!-- small scroll, mid-right edge -->
    <rect x="192" y="100" width="16" height="26" rx="1.5"/>
    <circle cx="192" cy="100" r="3"/>
    <circle cx="208" cy="126" r="3"/>
    <path d="M196 108h8M196 114h8"/>

    <!-- dotted alpana flourishes -->
    <circle cx="82" cy="56" r="1.3" fill="#A6762E" stroke="none"/>
    <circle cx="90" cy="48" r="1.3" fill="#A6762E" stroke="none"/>
    <circle cx="98" cy="44" r="1.3" fill="#A6762E" stroke="none"/>
    <circle cx="124" cy="166" r="1.3" fill="#A6762E" stroke="none"/>
    <circle cx="116" cy="174" r="1.3" fill="#A6762E" stroke="none"/>
    <circle cx="108" cy="178" r="1.3" fill="#A6762E" stroke="none"/>
  </g>
</svg>
